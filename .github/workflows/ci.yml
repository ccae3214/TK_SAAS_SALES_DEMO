# PR 開啟或更新時，在 GitHub 雲端檢查程式碼能不能成功 build。
# 不會碰到你的電腦，也不需要任何機密。
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同一個 PR 又推了新的 commit 時，取消還在跑的舊檢查，不用等它跑完，也不會疊一堆在跑。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --no-audit --no-fund：安裝時不去查安全公告與贊助訊息，只裝套件。
      - run: npm ci --no-audit --no-fund
      - run: npm run test:hr
      # Next.js 的 build 快取：程式沒大改時，build 可以重用上次的編譯結果。
      # 快取只在同一個 PR 的第二次以後推送（或重跑）才會命中；套件或原始碼改了就自動換新的。
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.js', 'tailwind.config.cjs', 'postcss.config.cjs', 'jsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
        env:
          NEXTAUTH_SECRET: ci-only-secret
          # 跳過 Docker 部署用的 standalone 打包，build 少約 15 秒；正式部署（Dockerfile）不受影響。
          SKIP_STANDALONE: '1'

  accounting-bot:
    name: accounting-bot tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: accounting-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: accounting-bot/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
