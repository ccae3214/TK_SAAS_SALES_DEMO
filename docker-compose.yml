
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-82988530}
      - POSTGRES_DB=${POSTGRES_DB:-saas_demo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-saas_demo}"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:8080}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-admin@example.com}
      - HR_ADMIN_EMAILS=${HR_ADMIN_EMAILS:-}
      - APP_ORIGIN=${APP_ORIGIN:-http://localhost:8080}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - LINE_LOGIN_CHANNEL_ID=${LINE_LOGIN_CHANNEL_ID:-}
      - LINE_LOGIN_CHANNEL_SECRET=${LINE_LOGIN_CHANNEL_SECRET:-}
      - LINE_MESSAGING_CHANNEL_SECRET=${LINE_MESSAGING_CHANNEL_SECRET:-}
      - LINE_MESSAGING_CHANNEL_ACCESS_TOKEN=${LINE_MESSAGING_CHANNEL_ACCESS_TOKEN:-}
      # Only these LINE IDs can manage other system administrator accounts.
      - HR_ADMIN_LINE_USER_IDS=${HR_ADMIN_LINE_USER_IDS:-}
      - HR_DOCUMENT_ENCRYPTION_KEY=${HR_DOCUMENT_ENCRYPTION_KEY:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-82988530}@postgres:5432/${POSTGRES_DB:-saas_demo}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  notebook:
    build:
      context: ../../New project/notebook_app
      dockerfile: Dockerfile
    env_file:
      - ../../New project/notebook_app/.env
    ports:
      - "127.0.0.1:8787:8000"
    restart: unless-stopped

  cloudflare-ddns:
    image: oznu/cloudflare-ddns:latest
    environment:
      - API_KEY=${CLOUDFLARE_API_TOKEN}
      - ZONE=${CLOUDFLARE_ZONE:-kolecion.cc}
      - SUBDOMAIN=${CLOUDFLARE_SUBDOMAIN:-}
      - PROXIED=${CLOUDFLARE_PROXIED:-true}
      - RRTYPE=A
      - CRON=${CLOUDFLARE_DDNS_CRON:-*/5 * * * *}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - notebook
    restart: always

volumes:
  postgres_data:
