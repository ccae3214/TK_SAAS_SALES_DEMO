
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      - POSTGRES_DB=${POSTGRES_DB:-saas_demo}
    ports:
      # 只開給本機（維護時用 psql / 備份）。以前是 "5432:5432"，會對外網開放資料庫。
      # app 容器走 compose 內部網路連 postgres:5432，不受影響。
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-saas_demo}"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # 只開給本機。對外一律經過 nginx（有 rate limit 與安全標頭），不要直接曝露 app。
      - "127.0.0.1:8080:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:8080}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-admin@example.com}
      - HR_ADMIN_EMAILS=${HR_ADMIN_EMAILS:-}
      - APP_ORIGIN=${APP_ORIGIN:-http://localhost:8080}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - LINE_LOGIN_CHANNEL_ID=${LINE_LOGIN_CHANNEL_ID:-}
      - LINE_LOGIN_CHANNEL_SECRET=${LINE_LOGIN_CHANNEL_SECRET:-}
      - LINE_MESSAGING_CHANNEL_SECRET=${LINE_MESSAGING_CHANNEL_SECRET:-}
      - LINE_MESSAGING_CHANNEL_ACCESS_TOKEN=${LINE_MESSAGING_CHANNEL_ACCESS_TOKEN:-}
      # Only these LINE IDs can manage other system administrator accounts.
      - HR_ADMIN_LINE_USER_IDS=${HR_ADMIN_LINE_USER_IDS:-}
      - HR_DOCUMENT_ENCRYPTION_KEY=${HR_DOCUMENT_ENCRYPTION_KEY:-}
      # 聊天室通話。簽章密鑰預設沿用 NEXTAUTH_SECRET；TURN 沒設定時只用 STUN（兩邊網路無法直連時會連不上）。
      - HR_CALL_SECRET=${HR_CALL_SECRET:-}
      - HR_CALL_STUN_URLS=${HR_CALL_STUN_URLS:-stun:stun.l.google.com:19302}
      - HR_CALL_TURN_URLS=${HR_CALL_TURN_URLS:-}
      - HR_CALL_TURN_SECRET=${HR_CALL_TURN_SECRET:-}
      # 來電通知：對方不在線上時，用網頁推播（Web Push，加到桌面後鎖屏也收得到）通知，沒送到再用 LINE。
      # 推播金鑰用「npx web-push generate-vapid-keys」產生；沒設定時網站不會顯示「來電通知」按鈕。
      - HR_PUSH_VAPID_PUBLIC_KEY=${HR_PUSH_VAPID_PUBLIC_KEY:-}
      - HR_PUSH_VAPID_PRIVATE_KEY=${HR_PUSH_VAPID_PRIVATE_KEY:-}
      - HR_PUSH_SUBJECT=${HR_PUSH_SUBJECT:-}
      # LINE 備援：fallback（預設，網頁推播沒送到才用 LINE，省每月推播額度）／always（兩種都送）／off（不用 LINE）
      - HR_CALL_LINE_NOTIFY=${HR_CALL_LINE_NOTIFY:-fallback}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-saas_demo}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  notebook:
    build:
      context: ../../New project/notebook_app
      dockerfile: Dockerfile
    env_file:
      - ../../New project/notebook_app/.env
    ports:
      - "127.0.0.1:8787:8000"
    restart: unless-stopped

  # LINE 記帳機器人（另一個官方帳號）。不對外開埠，由 nginx 轉送
  # /line/accounting/callback；資料存在自己的 SQLite volume，不使用 postgres。
  accounting-bot:
    build:
      context: ./accounting-bot
      dockerfile: Dockerfile
    environment:
      - LINE_CHANNEL_SECRET=${ACCOUNTING_LINE_CHANNEL_SECRET:-}
      - LINE_CHANNEL_ACCESS_TOKEN=${ACCOUNTING_LINE_CHANNEL_ACCESS_TOKEN:-}
      - REMINDER_TIME=${ACCOUNTING_REMINDER_TIME:-08:00}
      - SEND_EMPTY_REMINDER=${ACCOUNTING_SEND_EMPTY_REMINDER:-0}
      - ENABLE_SCHEDULER=1
      # 圖片辨識（發票／轉帳截圖／帳單）。沒設金鑰時只會停用這個功能，其他不受影響。
      - ANTHROPIC_API_KEY=${ACCOUNTING_ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ACCOUNTING_ANTHROPIC_MODEL:-claude-sonnet-5-5}
      - IMAGE_IN_GROUPS=${ACCOUNTING_IMAGE_IN_GROUPS:-0}
      - MAX_IMAGES_PER_DAY=${ACCOUNTING_MAX_IMAGES_PER_DAY:-30}
    volumes:
      - accounting_data:/data
    restart: unless-stopped

  cloudflare-ddns:
    image: oznu/cloudflare-ddns:latest
    environment:
      - API_KEY=${CLOUDFLARE_API_TOKEN}
      - ZONE=${CLOUDFLARE_ZONE:-kolecion.cc}
      - SUBDOMAIN=${CLOUDFLARE_SUBDOMAIN:-}
      - PROXIED=${CLOUDFLARE_PROXIED:-true}
      - RRTYPE=A
      - CRON=${CLOUDFLARE_DDNS_CRON:-*/5 * * * *}
    restart: unless-stopped

  # 通話的 TURN 中繼伺服器（coturn，選配：docker-compose --profile turn up -d）。
  # 兩邊的網路無法直連時（例如手機行動網路），聲音與影像會經過這裡轉送。
  # 需要：1) 路由器把 3478（TCP 與 UDP）和 49160-49260（UDP）轉到這台電腦、防火牆放行；
  #       2) turn 網域是 DNS only（不能經 Cloudflare 代理，它不轉送 UDP）；
  #       3) .env 設定 HR_CALL_TURN_SECRET、TURN_EXTERNAL_IP（對外 IP）與 HR_CALL_TURN_URLS。
  coturn:
    image: coturn/coturn:latest
    profiles: ["turn"]
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49260:49160-49260/udp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--realm=${TURN_REALM:-kolecion.cc}"
      - "--use-auth-secret"
      - "--static-auth-secret=${HR_CALL_TURN_SECRET:-}"
      - "--external-ip=${TURN_EXTERNAL_IP:-}"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49260"
      - "--fingerprint"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--no-multicast-peers"
      - "--user-quota=12"
      - "--total-quota=100"
      # 不讓 TURN 被拿來連到內部網路
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
    restart: unless-stopped

  # turn.kolecion.cc 的 DDNS（DNS only，不經 Cloudflare 代理）。
  cloudflare-ddns-turn:
    image: oznu/cloudflare-ddns:latest
    profiles: ["turn"]
    environment:
      - API_KEY=${CLOUDFLARE_API_TOKEN}
      - ZONE=${CLOUDFLARE_ZONE:-kolecion.cc}
      - SUBDOMAIN=turn
      - PROXIED=false
      - RRTYPE=A
      - CRON=${CLOUDFLARE_DDNS_CRON:-*/5 * * * *}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - notebook
    restart: always

volumes:
  postgres_data:
  accounting_data:
