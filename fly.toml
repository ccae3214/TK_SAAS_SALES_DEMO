app = "tk-saas-sales-demo"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  APP_ORIGIN = "https://tk-saas-sales-demo.fly.dev"
  NEXTAUTH_URL = "https://tk-saas-sales-demo.fly.dev"
  DATABASE_PATH = "/data/database.sqlite"
  AUTH_TRUST_HOST = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "5gb"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
